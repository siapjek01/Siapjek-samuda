<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiapJek Pelanggan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #047857; font-family: sans-serif; }
  </style>
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div id="splashScreen" class="fixed inset-0 flex flex-col items-center justify-between p-8 text-white z-50">
    <div class="flex-1 flex flex-col items-center justify-center space-y-4 text-center">
      <div class="w-20 h-20 bg-orange-500 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-2xl animate-pulse">SJ</div>
      <div>
        <h1 class="text-2xl font-black">SIAPJEK</h1>
        <p class="text-xs text-emerald-200 font-bold mt-1 uppercase">Aplikasi Pelanggan</p>
      </div>
      
      <div id="loadingState" class="pt-4 flex flex-col items-center gap-3 text-xs font-bold text-emerald-100">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-circle-notch fa-spin text-orange-400 text-lg"></i>
          <span id="statusText">Menghubungkan ke Server...</span>
        </div>
        <!-- Tombol Darurat jika koneksi lambat -->
        <button id="btnManual" onclick="bukaPaksaApp()" class="hidden bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-black shadow-md mt-2">
          Buka Aplikasi Sekarang ➔
        </button>
      </div>
    </div>

    <!-- BOX ERROR SERVER -->
    <div id="errorBox" class="hidden bg-red-600/90 text-white p-4 rounded-2xl text-xs text-center border border-red-400 max-w-xs space-y-2">
      <p id="errorMessage" class="font-bold"></p>
      <button onclick="location.reload()" class="bg-white text-red-600 font-black px-3 py-1.5 rounded-xl text-[10px]">Coba Lagi</button>
    </div>

    <p class="text-[10px] text-emerald-300 font-semibold">SAMUDA CENTRAL KALIMANTAN</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_Ndbf9idBUkMb5aNU-Bc8qZIEVI90Ddk",
      authDomain: "siapjek-8d69c.firebaseapp.com",
      databaseURL: "https://siapjek-8d69c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "siapjek-8d69c"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const statusText = document.getElementById('statusText');
    const btnManual = document.getElementById('btnManual');
    
    let globalAppUrl = '';

    function bukaPaksaApp() {
      if (globalAppUrl && globalAppUrl.trim().startsWith('http')) {
        window.location.href = globalAppUrl;
      } else {
        alert('URL Aplikasi belum diatur di Panel Admin!');
      }
    }

    // Eksekusi Ambil URL dari Firebase
    statusText.innerText = 'Memeriksa Konfigurasi Server...';

    // Munculkan tombol manual jika dalam 3 detik database tidak merespon
    let timerDarurat = setTimeout(() => {
      btnManual.classList.remove('hidden');
    }, 3000);

    db.ref('settings/app_url').once('value')
      .then((snapshot) => {
        clearTimeout(timerDarurat);
        globalAppUrl = snapshot.val();
        
        if (globalAppUrl && globalAppUrl.trim().startsWith('http')) {
          statusText.innerText = 'Mengarahkan ke Aplikasi...';
          // Langsung pindah halaman (Redirect) tanpa iframe
          window.location.replace(globalAppUrl);
        } else {
          statusText.innerText = 'Gagal Memuat';
          document.getElementById('errorMessage').innerText = 'URL Pelanggan kosong di Database Admin.';
          document.getElementById('errorBox').classList.remove('hidden');
        }
      })
      .catch((error) => {
        clearTimeout(timerDarurat);
        statusText.innerText = 'Gangguan Koneksi';
        document.getElementById('errorMessage').innerText = error.message;
        document.getElementById('errorBox').classList.remove('hidden');
        btnManual.classList.remove('hidden');
      });
  </script>
</body>
</html>
