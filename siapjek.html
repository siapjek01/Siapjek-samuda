<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiapJek Pelanggan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #047857; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: none; }
  </style>
</head>
<body>
  <!-- SPLASH SCREEN & PERINGATAN LOKASI -->
  <div id="splashScreen" class="fixed inset-0 flex flex-col items-center justify-between p-8 text-white z-50">
    <div class="flex-1 flex flex-col items-center justify-center space-y-4 text-center">
      <div class="w-20 h-20 bg-orange-500 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-2xl animate-pulse">SJ</div>
      <div>
        <h1 class="text-2xl font-black">SIAPJEK</h1>
        <p class="text-xs text-emerald-200 font-bold mt-1 uppercase">Aplikasi Pelanggan</p>
      </div>
      
      <div id="loadingState" class="pt-4 flex items-center gap-2 text-xs font-bold text-emerald-100">
        <i class="fa-solid fa-circle-notch fa-spin text-orange-400 text-lg"></i>
        <span id="statusText">Memeriksa Akses Lokasi & Server...</span>
      </div>
    </div>

    <!-- BOX POP-UP JIKA LOKASI DITOLAK / GPS MATI -->
    <div id="locationAlert" class="hidden bg-white text-slate-800 p-5 rounded-2xl text-xs text-center shadow-2xl space-y-3 max-w-xs border border-emerald-200">
      <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <div>
        <h3 class="font-black text-sm text-slate-800">Izin Lokasi Diperlukan</h3>
        <p class="text-[11px] text-slate-500 mt-1">SiapJek membutuhkan akses lokasi/GPS untuk menentukan titik penjemputan dan melacak pesanan Anda secara presisi.</p>
      </div>
      <button onclick="requestLocationPermission()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-crosshairs"></i> Aktifkan Lokasi Saya
      </button>
    </div>

    <!-- BOX ERROR SERVER -->
    <div id="errorBox" class="hidden bg-red-600/90 text-white p-4 rounded-2xl text-xs text-center border border-red-400 max-w-xs space-y-2">
      <p id="errorMessage" class="font-bold"></p>
      <button onclick="location.reload()" class="bg-white text-red-600 font-black px-3 py-1.5 rounded-xl text-[10px]">Coba Lagi</button>
    </div>

    <p class="text-[10px] text-emerald-300 font-semibold">SAMUDA CENTRAL KALIMANTAN</p>
  </div>

  <!-- IFRAME DENGAN IZIN LOKASI LENGKAP -->
  <iframe id="appFrame" allow="geolocation *; camera *; microphone *"></iframe>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_Ndbf9idBUkMb5aNU-Bc8qZIEVI90Ddk",
      authDomain: "siapjek-8d69c.firebaseapp.com",
      databaseURL: "https://siapjek-8d69c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "siapjek-8d69c"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const splashScreen = document.getElementById('splashScreen');
    const appFrame = document.getElementById('appFrame');
    const locationAlert = document.getElementById('locationAlert');
    const loadingState = document.getElementById('loadingState');
    const statusText = document.getElementById('statusText');

    let targetAppUrl = '';
    let isAppLoaded = false;

    // Memuat aplikasi utama ke dalam iframe
    function loadAppFrame() {
      if (isAppLoaded) return; // Mencegah pemuatan ganda
      
      if (targetAppUrl && targetAppUrl.trim().startsWith('http')) {
        statusText.innerText = 'Membuka Aplikasi...';
        if (appFrame.src !== targetAppUrl) appFrame.src = targetAppUrl;
        
        appFrame.onload = () => {
          isAppLoaded = true;
          splashScreen.style.display = 'none';
          appFrame.style.display = 'block';
        };
      }
    }

    // Memeriksa lokasi tanpa memblokir pembukaan aplikasi
    function requestLocationPermission() {
      statusText.innerText = 'Memeriksa Akses Lokasi...';
      
      // Batas waktu pengaman: Buka aplikasi secara otomatis jika GPS di WebView tidak merespon dalam 4 detik
      let safetyTimeout = setTimeout(() => {
        loadAppFrame();
      }, 4000);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            clearTimeout(safetyTimeout);
            loadAppFrame();
          },
          (error) => {
            clearTimeout(safetyTimeout);
            // Tetap buka aplikasi agar pelanggan dapat menggunakan fitur input lokasi manual
            loadAppFrame();
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else {
        clearTimeout(safetyTimeout);
        loadAppFrame();
      }
    }

    // Inisialisasi data dari Firebase
    db.ref('settings/app_url').once('value', (snapshot) => {
      targetAppUrl = snapshot.val();
      if (targetAppUrl && targetAppUrl.trim().startsWith('http')) {
        requestLocationPermission();
      } else {
        statusText.innerText = 'Gagal Memuat';
        document.getElementById('errorMessage').innerText = 'URL Pelanggan belum diisi oleh Admin di Panel Admin.';
        document.getElementById('errorBox').classList.remove('hidden');
        loadingState.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
