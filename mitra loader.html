<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiapJek Mitra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #c2410c; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: none; }
  </style>
</head>
<body>
  <!-- SPLASH SCREEN & PERINGATAN LOKASI MITRA -->
  <div id="splashScreen" class="fixed inset-0 flex flex-col items-center justify-between p-8 text-white z-50">
    <div class="flex-1 flex flex-col items-center justify-center space-y-4 text-center">
      <div class="w-20 h-20 bg-amber-500 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-2xl animate-pulse">
        <i class="fa-solid fa-store"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black">SIAPJEK MITRA</h1>
        <p class="text-xs text-orange-200 font-bold mt-1 uppercase">Aplikasi Toko & Merchant</p>
      </div>
      
      <div id="loadingState" class="pt-4 flex items-center gap-2 text-xs font-bold text-orange-100">
        <i class="fa-solid fa-circle-notch fa-spin text-white text-lg"></i>
        <span id="statusText">Memeriksa Akses Lokasi Toko...</span>
      </div>
    </div>

    <!-- BOX POP-UP JIKA LOKASI DITOLAK / GPS MATI -->
    <div id="locationAlert" class="hidden bg-white text-slate-800 p-5 rounded-2xl text-xs text-center shadow-2xl space-y-3 max-w-xs border border-orange-200">
      <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-map-pin"></i>
      </div>
      <div>
        <h3 class="font-black text-sm text-slate-800">Izin Lokasi Toko</h3>
        <p class="text-[11px] text-slate-500 mt-1">SiapJek Mitra membutuhkan izin lokasi agar penentuan posisi titik peta toko Anda presisi bagi driver penjemput.</p>
      </div>
      <button onclick="requestLocationPermission()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-2.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-location-arrow"></i> Izinkan Akses Lokasi
      </button>
    </div>

    <!-- BOX ERROR SERVER -->
    <div id="errorBox" class="hidden bg-red-600/90 text-white p-4 rounded-2xl text-xs text-center border border-red-400 max-w-xs space-y-2">
      <p id="errorMessage" class="font-bold"></p>
      <button onclick="location.reload()" class="bg-white text-red-600 font-black px-3 py-1.5 rounded-xl text-[10px]">Coba Lagi</button>
    </div>

    <p class="text-[10px] text-orange-300 font-semibold">SAMUDA CENTRAL KALIMANTAN</p>
  </div>

  <!-- IFRAME DENGAN IZIN LOKASI LENGKAP -->
  <iframe id="appFrame" allow="geolocation *; camera *; microphone *"></iframe>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_Ndbf9idBUkMb5aNU-Bc8qZIEVI90Ddk",
      authDomain: "siapjek-8d69c.firebaseapp.com",
      databaseURL: "https://siapjek-8d69c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "siapjek-8d69c"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const splashScreen = document.getElementById('splashScreen');
    const appFrame = document.getElementById('appFrame');
    const locationAlert = document.getElementById('locationAlert');
    const loadingState = document.getElementById('loadingState');

    let targetAppUrl = '';

    function requestLocationPermission() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            locationAlert.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadAppFrame();
          },
          (error) => {
            loadingState.classList.add('hidden');
            locationAlert.classList.remove('hidden');
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        alert("HP Anda tidak mendukung geolokasi.");
      }
    }

    function loadAppFrame() {
      if (targetAppUrl && targetAppUrl.trim().startsWith('http')) {
        if (appFrame.src !== targetAppUrl) appFrame.src = targetAppUrl;
        appFrame.onload = () => {
          splashScreen.style.display = 'none';
          appFrame.style.display = 'block';
        };
      }
    }

    db.ref('settings/mitra_app_url').on('value', (snapshot) => {
      targetAppUrl = snapshot.val();
      if (targetAppUrl && targetAppUrl.trim().startsWith('http')) {
        requestLocationPermission();
      } else {
        document.getElementById('statusText').innerText = 'Gagal Memuat';
        document.getElementById('errorMessage').innerText = 'URL Mitra belum diisi oleh Admin di Panel Admin.';
        document.getElementById('errorBox').classList.remove('hidden');
        loadingState.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
